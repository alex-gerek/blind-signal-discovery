# Full research configuration for Blind Signal Discovery (BSD) v0.1
[experiment]
name = "research_v01"
seeds = [101, 202, 303]
output_dir = "results/research_v01"

[signal]
sample_rate = 1024.0
duration = 4.0
snr_levels = [4.0, 6.0, 8.0, 10.0, 12.0, 16.0, 20.0, 25.0]
known_families = ["sinusoid", "broadband_pulse", "linear_chirp", "intermittent_narrowband"]
withheld_families = ["sinusoidal_fm"]

[noise]
calibration_models = ["gaussian_white", "pink_colored", "nonstationary"]
evaluation_models = ["gaussian_white", "pink_colored", "nonstationary"]
shifted_models = ["shifted_ar2"]
impulsive_models = ["impulsive"]

[detector]
nperseg = 128
noverlap = 96
window = "hann"
freq_median_kernel = 11
time_median_kernel = 15
bin_seed_threshold = 4.0
min_cluster_bins = 2

[calibration]
target_fap = 0.01
n_calibration_samples = 600

[evaluation]
n_noise_test = 500
n_signal_test = 512
n_withheld_test = 160
n_shifted_noise = 150
n_shifted_signal = 160
n_robustness_per_condition = 100
