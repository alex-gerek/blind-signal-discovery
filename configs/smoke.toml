# Fast smoke-test configuration for Blind Signal Discovery (BSD) v0.1
[experiment]
name = "smoke"
seeds = [101, 202]
output_dir = "results/smoke"

[signal]
sample_rate = 1024.0
duration = 4.0
snr_levels = [6.0, 12.0, 20.0]
known_families = ["sinusoid", "broadband_pulse", "linear_chirp", "intermittent_narrowband"]
withheld_families = ["sinusoidal_fm"]

[noise]
calibration_models = ["gaussian_white", "pink_colored", "nonstationary"]
evaluation_models = ["gaussian_white", "pink_colored", "nonstationary"]
shifted_models = ["shifted_ar2"]
impulsive_models = ["impulsive"]

[detector]
nperseg = 128
noverlap = 96
window = "hann"
freq_median_kernel = 11
time_median_kernel = 15
bin_seed_threshold = 4.0
min_cluster_bins = 2

[calibration]
target_fap = 0.01
n_calibration_samples = 120

[evaluation]
n_noise_test = 100
n_signal_test = 120
n_withheld_test = 45
n_shifted_noise = 40
n_shifted_signal = 45
n_robustness_per_condition = 30
