[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blind-signal-discovery"
version = "0.3.0"
description = "Standalone research prototype for template-free unknown signal detection in noisy time-series data with calibrated false-alarm control."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Lex Gerek" },
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
ligo = [
    "h5py>=3.10",
]
gui = [
    "streamlit>=1.35",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
